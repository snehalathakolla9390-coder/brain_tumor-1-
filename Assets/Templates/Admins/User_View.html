{% extends 'Admins/AdminHome.html' %}
{% block contents %}
<style>

</style>
<table class="table table-hover table-sm">
    <thead class="text-center" style="background-color: #2563eb; color: #ffffff;">
        <tr>
            <th>Sl N    o</th>
            <th>Name</th>
            <th>Username</th>
            <th>Address</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for data in users %}
        <tr class="text-center">
            <td>{{ forloop.counter }}</td>
            <td>{{ data.Name }}</td>
            <td>{{ data.Username }}</td>
            <td>{{ data.Address }}</td>
            <td><a href="{% url 'ActivateUser' data.id %}" class="btn btn-outline-primary"
                    style="padding: 2px 8px; margin-top: 1%; color: #2563eb; border-color: #2563eb;">{{ data.Status }}</a></td>
            <td>
                <a href="{%url 'DeleteUser' data.id %}" class="btn btn-sm btn-outline-primary"
                    style="padding: 2px 8px; margin-top: 1%; color: #2563eb; border-color: #2563eb;">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
